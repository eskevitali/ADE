{% extends "base.html" %}
{% block title %}New Project — ADE v4{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold text-white mb-2">New Project</h1>
  <p class="text-gray-400 mb-8">Опишите идею — ADE создаст изолированный ADI и запустит workflow: Spec → Code → Review</p>

  <form method="post" action="/projects/new" class="glass rounded-xl p-6 space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-2">Название проекта</label>
      <input type="text" name="project_name" maxlength="120"
        class="w-full bg-gray-900/80 border border-indigo-500/30 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="Например: Task Manager API">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-2">Идея / описание проекта</label>
      <textarea name="task" rows="6" required minlength="10"
        class="w-full bg-gray-900/80 border border-indigo-500/30 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="Например: REST API для управления задачами с аутентификацией JWT и PostgreSQL"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-2">Workflow</label>
      <select name="workflow" class="w-full bg-gray-900/80 border border-indigo-500/30 rounded-lg px-4 py-3 text-white">
        <option value="dev_cycle" selected>Dev Cycle (Architect → Coder → Reviewer)</option>
        <option value="supervisor">Supervisor (multi-agent routing)</option>
      </select>
    </div>
    <div class="flex items-center gap-3">
      <input type="checkbox" name="human_in_loop" value="on" id="hitl" checked
        class="w-4 h-4 rounded border-indigo-500/30 bg-gray-900 text-indigo-600 focus:ring-indigo-500">
      <label for="hitl" class="text-sm text-gray-300">Human-in-the-loop (подтверждение Spec и Code)</label>
    </div>
    <button type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition">
      Запустить ADI Workflow
    </button>
  </form>
</div>
{% endblock %}
