# ADE v4 — Nginx reverse proxy for kider.at
# Install: sudo cp nginx/ade.conf /etc/nginx/sites-available/ade.conf
#          sudo ln -sf /etc/nginx/sites-available/ade.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream ade_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP — redirect to HTTPS (after certbot)
server {
    listen 80;
    listen [::]:80;
    server_name ade.kider.at;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main ADE proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ade.kider.at;

    # Certbot will populate these paths:
    ssl_certificate     /etc/letsencrypt/live/ade.kider.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ade.kider.at/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://ade_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# WebSocket upgrade map (add to http {} block in nginx.conf if missing):
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
