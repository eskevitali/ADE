# ADI workspace — Diktor
services:
  workspace:
    image: python:3.12-slim
    container_name: ade-adi-8c206b97-76c1-46bb-844c-d8e0c60856d3-workspace
    working_dir: /workspace
    volumes:
      - /root/ADE-V4/projects/8c206b97-76c1-46bb-844c-d8e0c60856d3/src:/workspace/src
      - /root/ADE-V4/projects/8c206b97-76c1-46bb-844c-d8e0c60856d3/data:/workspace/data
    command: sleep infinity
    restart: unless-stopped

networks:
  adi_net:
    external: true
    name: ade-adi-8c206b97-76c1-46bb-844c-d8e0c60856d3
